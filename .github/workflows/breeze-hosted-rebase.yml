name: Breeze hosted semantic rebase

on:
  push:
    branches:
      - ci/breeze-hosted-bootstrap
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: breeze-hosted-rebase-preflight
  cancel-in-progress: true

jobs:
  semantic-rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRODUCT_BASE: 66e4be60020fc281e94abfdcb37b86389283c03f
      FIRST_FIVE: 9ad4c05542a7eef639f3ba30448cb083865a5c66
      EXPECTED_BREEZE: 7047fd3d03eec7cd108a7001b17ba6e8eb70bfe1
      EXPECTED_MAIN: 0289ec3b7da744b449257514ad393bb840d511da
      CANDIDATE_BRANCH: ci/breeze-rebased-candidate
    steps:
      - name: Checkout only Breeze-touched paths
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /AGENTS.md
            /BREEZE.md
            /docs/ROADMAP.md
            /docs/STATUS.md
            /docs/PERFORMANCE.md
            /chrome/app/chrome_dll.rc
            /chrome/app/generated_resources.grd
            /chrome/browser/BUILD.gn
            /chrome/browser/autofill/test/android/java/src/org/chromium/chrome/browser/autofill/PersonalDataManagerTest.java
            /chrome/browser/breeze_adblock/
            /chrome/browser/chrome_content_browser_client.cc
            /chrome/browser/extensions/component_extensions_allowlist/
            /chrome/browser/extensions/component_loader.cc
            /chrome/browser/extensions/component_loader.h
            /chrome/browser/global_keyboard_shortcuts_mac.mm
            /chrome/browser/resources/breeze_search/
            /chrome/browser/resources/breeze_sponsorblock/
            /chrome/browser/resources/component_extension_resources.grd
            /chrome/browser/ui/accelerator_table.cc
            /chrome/browser/ui/page_info/
            /chrome/browser/ui/views/page_info/
            /chrome/browser/ui/views/profiles/profile_bubble_interactive_uitest.cc
            /chrome/browser/universal_web_contents_observers.cc
            /chrome/common/extensions/extension_constants.h
            /chrome/test/BUILD.gn
            /components/autofill/core/common/autofill_prefs.cc
            /components/autofill/core/common/autofill_prefs_unittest.cc
            /components/password_manager/core/browser/password_manager.cc
            /third_party/easylist/
            /third_party/sponsorblock/
            /third_party/rust/chromium_crates_io/Cargo.toml
            /third_party/rust/chromium_crates_io/Cargo.lock
            /third_party/rust/chromium_crates_io/gnrt_config.toml
            /third_party/rust/chromium_crates_io/patches/adblock-v0_13/
            /third_party/rust/chromium_crates_io/patches/flatbuffers-v25/

      - name: Fetch bounded Chromium history and verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          git -c submodule.recurse=false fetch --filter=blob:none --no-tags --depth=32 origin "$EXPECTED_BREEZE"
          git -c submodule.recurse=false fetch --filter=blob:none --no-tags --depth=2300 origin "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_BREEZE" "$EXPECTED_MAIN")" = "$PRODUCT_BASE"
          git cat-file -e "$FIRST_FIVE^{commit}"
          printf 'breeze=%s\nmain=%s\nbase=%s\n' "$EXPECTED_BREEZE" "$EXPECTED_MAIN" "$PRODUCT_BASE"

      - name: Rebase the first five commits normally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name BreezeDelegate
          git config user.email 271538431+BreezeDelegate@users.noreply.github.com
          git config submodule.recurse false
          git checkout -B breeze-rebase-candidate "$FIRST_FIVE"
          git rebase --onto "$EXPECTED_MAIN" "$PRODUCT_BASE" breeze-rebase-candidate

      - name: Apply remaining Breeze source without stale generated Rust
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary "$FIRST_FIVE" "$EXPECTED_BREEZE" -- . \
            ':(exclude)third_party/rust/**' \
            > /tmp/breeze-source.patch
          git diff --binary "$FIRST_FIVE" "$EXPECTED_BREEZE" -- \
            third_party/rust/chromium_crates_io/patches/adblock-v0_13/ \
            third_party/rust/chromium_crates_io/patches/flatbuffers-v25/ \
            >> /tmp/breeze-source.patch
          test -s /tmp/breeze-source.patch
          git apply --3way --index /tmp/breeze-source.patch

          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('third_party/rust/chromium_crates_io/Cargo.toml')
          text = cargo.read_text()
          dep = 'adblock = { version = "0.13.3", default-features = false, features = ["full-regex-handling"] }\n'
          if 'adblock = {' in text:
              raise SystemExit('unexpected upstream adblock dependency')
          marker = '[dependencies]\n'
          if marker not in text:
              raise SystemExit('missing [dependencies]')
          cargo.write_text(text.replace(marker, marker + dep, 1))

          cfg = Path('third_party/rust/chromium_crates_io/gnrt_config.toml')
          text = cfg.read_text()
          sections = {
              'adblock': 'extra_kv = { allow_unsafe = true }',
              'arrayvec': 'extra_kv = { allow_unsafe = true }',
              'flatbuffers': 'license_files = ["LICENSE"]\nextra_kv = { allow_unsafe = true }',
              'form_urlencoded': 'extra_kv = { allow_unsafe = true }',
          }
          for name, body in sections.items():
              if f'[crate.{name}]' in text or f'[crate.{name}.extra_kv]' in text:
                  raise SystemExit(f'unexpected upstream {name} gnrt config')
              text = text.rstrip() + f'\n\n[crate.{name}]\n{body}\n'
          cfg.write_text(text)
          PY

          git add third_party/rust/chromium_crates_io/Cargo.toml \
                  third_party/rust/chromium_crates_io/gnrt_config.toml \
                  third_party/rust/chromium_crates_io/patches/adblock-v0_13/ \
                  third_party/rust/chromium_crates_io/patches/flatbuffers-v25/
          git commit -m 'Reapply Breeze blocking on current Chromium'

      - name: Assert semantic candidate before gnrt
        shell: bash
        run: |
          set -euo pipefail
          test -f BREEZE.md
          test -f chrome/browser/breeze_adblock/breeze_adblock_ffi.rs
          test -f chrome/browser/breeze_adblock/breeze_adblock_service.cc
          grep -F 'adblock = { version = "0.13.3"' third_party/rust/chromium_crates_io/Cargo.toml
          grep -F '[crate.adblock]' third_party/rust/chromium_crates_io/gnrt_config.toml
          grep -F '[crate.arrayvec]' third_party/rust/chromium_crates_io/gnrt_config.toml
          grep -F '[crate.flatbuffers]' third_party/rust/chromium_crates_io/gnrt_config.toml
          grep -F '[crate.form_urlencoded]' third_party/rust/chromium_crates_io/gnrt_config.toml
          test -f third_party/rust/chromium_crates_io/patches/adblock-v0_13/0001-Add-preparsed-cosmetic-query.diff
          test -f third_party/rust/chromium_crates_io/patches/flatbuffers-v25/0001-Add-upstream-license.diff
          grep -F 'index 0000000..d645695' third_party/rust/chromium_crates_io/patches/flatbuffers-v25/0001-Add-upstream-license.diff
          test "$(git merge-base HEAD "$EXPECTED_MAIN")" = "$EXPECTED_MAIN"
          test "$(git diff --name-only "$EXPECTED_MAIN" HEAD -- 'third_party/rust/**' | grep -v '^third_party/rust/chromium_crates_io/Cargo.toml$' | grep -v '^third_party/rust/chromium_crates_io/gnrt_config.toml$' | grep -v '^third_party/rust/chromium_crates_io/patches/adblock-v0_13/' | grep -v '^third_party/rust/chromium_crates_io/patches/flatbuffers-v25/' | wc -l)" -eq 0

      - name: Materialize current Chromium Rust tooling
        shell: bash
        run: |
          set -euo pipefail
          git sparse-checkout add \
            '/tools/crates/' \
            '/tools/rust/' \
            '/tools/clang/scripts/' \
            '/build/vs_toolchain.py' \
            '/build/gn_helpers.py' \
            '/build/rust/' \
            '/build/config/' \
            '/third_party/rust/'
          test -f tools/crates/run_gnrt.py
          test -f tools/rust/update_rust.py
          test -f build/vs_toolchain.py
          test -f build/gn_helpers.py
          test -f third_party/rust/chromium_crates_io/Cargo.lock

      - name: Install pinned Chromium Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rust/update_rust.py
          python3 tools/rust/update_rust.py --print-revision validate
          third_party/rust-toolchain/bin/rustc --version
          third_party/rust-toolchain/bin/cargo --version

      - name: Regenerate adblock-rust with gnrt
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/crates/run_gnrt.py vendor
          python3 tools/crates/run_gnrt.py gen

          python3 - <<'PY'
          from pathlib import Path
          lock = Path('third_party/rust/chromium_crates_io/Cargo.lock').read_text()
          needle = 'name = "adblock"\nversion = "0.13.3"'
          if needle not in lock:
              raise SystemExit('Cargo.lock does not resolve adblock 0.13.3')
          PY
          test -f third_party/rust/adblock/v0_13/BUILD.gn
          test -f third_party/rust/adblock/v0_13/README.chromium
          grep -F 'crate_name = "adblock"' third_party/rust/adblock/v0_13/BUILD.gn
          git diff --name-only "$EXPECTED_MAIN" HEAD -- third_party/rust/ | sort > /tmp/rust-before-commit.txt
          test -s /tmp/rust-before-commit.txt
          git add third_party/rust/
          git commit -m 'Regenerate adblock-rust 0.13.3 with gnrt'

      - name: Validate candidate structure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXPECTED_MAIN")" = "$EXPECTED_MAIN"
          grep -F 'adblock = { version = "0.13.3"' third_party/rust/chromium_crates_io/Cargo.toml
          python3 - <<'PY'
          from pathlib import Path
          lock = Path('third_party/rust/chromium_crates_io/Cargo.lock').read_text()
          assert 'name = "adblock"\nversion = "0.13.3"' in lock
          PY
          git diff --check "$EXPECTED_MAIN" HEAD -- \
            'chrome/**/*.cc' 'chrome/**/*.h' 'chrome/**/*.rs' \
            'components/**/*.cc' 'components/**/*.h' \
            'docs/*.md' 'BREEZE.md' 'AGENTS.md' \
            'third_party/rust/**/*.toml' 'third_party/rust/**/*.gn' \
            'third_party/rust/**/*.chromium'
          printf 'candidate=%s\n' "$(git rev-parse HEAD)"
          git status --short

      - name: Publish isolated rebased candidate
        shell: bash
        run: |
          set -euo pipefail
          git log -8 --format='%h %an <%ae> %s'
          test "$(git log -1 --format=%ae)" = '271538431+BreezeDelegate@users.noreply.github.com'
          git push --force origin HEAD:"refs/heads/$CANDIDATE_BRANCH"

      - name: Record candidate metadata
        if: always()
        shell: bash
        run: |
          {
            echo '## Breeze hosted semantic rebase + gnrt'
            echo
            echo "- source breeze: \`$EXPECTED_BREEZE\`"
            echo "- Chromium main: \`$EXPECTED_MAIN\`"
            echo "- product base: \`$PRODUCT_BASE\`"
            echo "- candidate branch: \`$CANDIDATE_BRANCH\`"
            echo
            echo 'Temporary GitHub-hosted path. Product promotion remains blocked on reconciling the preserved VPS hot-swap WIP and final self-hosted validation.'
          } >> "$GITHUB_STEP_SUMMARY"
