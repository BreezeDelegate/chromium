name: Breeze hosted rebase preflight

on:
  push:
    branches:
      - ci/breeze-hosted-bootstrap
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breeze-hosted-rebase-preflight
  cancel-in-progress: true

jobs:
  rebase-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_BASE: 66e4be60020fc281e94abfdcb37b86389283c03f
      EXPECTED_BREEZE: 7047fd3d03eec7cd108a7001b17ba6e8eb70bfe1
      EXPECTED_MAIN: 0289ec3b7da744b449257514ad393bb840d511da
    steps:
      - name: Checkout only Breeze-touched paths
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /AGENTS.md
            /BREEZE.md
            /docs/ROADMAP.md
            /docs/STATUS.md
            /docs/PERFORMANCE.md
            /chrome/app/chrome_dll.rc
            /chrome/app/generated_resources.grd
            /chrome/browser/BUILD.gn
            /chrome/browser/autofill/test/android/java/src/org/chromium/chrome/browser/autofill/PersonalDataManagerTest.java
            /chrome/browser/breeze_adblock/
            /chrome/browser/chrome_content_browser_client.cc
            /chrome/browser/extensions/component_extensions_allowlist/
            /chrome/browser/extensions/component_loader.cc
            /chrome/browser/extensions/component_loader.h
            /chrome/browser/global_keyboard_shortcuts_mac.mm
            /chrome/browser/resources/breeze_search/
            /chrome/browser/resources/breeze_sponsorblock/
            /chrome/browser/resources/component_extension_resources.grd
            /chrome/browser/ui/accelerator_table.cc
            /chrome/browser/ui/page_info/
            /chrome/browser/ui/views/page_info/
            /chrome/browser/ui/views/profiles/profile_bubble_interactive_uitest.cc
            /chrome/browser/universal_web_contents_observers.cc
            /chrome/common/extensions/extension_constants.h
            /chrome/test/BUILD.gn
            /components/autofill/core/common/autofill_prefs.cc
            /components/autofill/core/common/autofill_prefs_unittest.cc
            /components/password_manager/core/browser/password_manager.cc
            /third_party/easylist/
            /third_party/sponsorblock/
            /third_party/rust/adblock/
            /third_party/rust/arrayvec/
            /third_party/rust/bitflags/
            /third_party/rust/chromium_crates_io/Cargo.toml
            /third_party/rust/chromium_crates_io/Cargo.lock
            /third_party/rust/chromium_crates_io/gnrt_config.toml
            /third_party/rust/chromium_crates_io/patches/adblock-v0_13/
            /third_party/rust/chromium_crates_io/patches/flatbuffers-v25/
            /third_party/rust/chromium_crates_io/patches/seahash-v4/

      - name: Fetch bounded Chromium history and verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          git -c submodule.recurse=false fetch --filter=blob:none --no-tags --depth=32 origin "$EXPECTED_BREEZE"
          git -c submodule.recurse=false fetch --filter=blob:none --no-tags --depth=2300 origin "$EXPECTED_MAIN"
          git cat-file -e "$PRODUCT_BASE^{commit}"
          git cat-file -e "$EXPECTED_BREEZE^{commit}"
          git cat-file -e "$EXPECTED_MAIN^{commit}"
          test "$(git merge-base "$EXPECTED_BREEZE" "$EXPECTED_MAIN")" = "$PRODUCT_BASE"
          printf 'breeze=%s\nmain=%s\nbase=%s\n' \
            "$EXPECTED_BREEZE" "$EXPECTED_MAIN" "$PRODUCT_BASE"

      - name: Rebase product commits onto audited Chromium main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name BreezeDelegate
          git config user.email 271538431+BreezeDelegate@users.noreply.github.com
          git config submodule.recurse false
          git checkout -B breeze-rebase-candidate "$EXPECTED_BREEZE"
          git rebase --onto "$EXPECTED_MAIN" "$PRODUCT_BASE" breeze-rebase-candidate

      - name: Assert Breeze files survived and generated Rust still needs regeneration
        shell: bash
        run: |
          set -euo pipefail
          test -f BREEZE.md
          test -f chrome/browser/breeze_adblock/breeze_adblock_ffi.rs
          test -f chrome/browser/breeze_adblock/breeze_adblock_service.cc
          test -f third_party/rust/chromium_crates_io/Cargo.toml
          grep -F 'adblock = { version = "0.13.2"' third_party/rust/chromium_crates_io/Cargo.toml
          grep -F '[crate.adblock]' third_party/rust/chromium_crates_io/gnrt_config.toml
          printf 'rebased_head=%s\n' "$(git rev-parse HEAD)"
          git status --short

      - name: Record candidate patch metadata
        if: always()
        shell: bash
        run: |
          {
            echo '## Breeze hosted rebase preflight'
            echo
            echo "- source breeze: \`$EXPECTED_BREEZE\`"
            echo "- Chromium main: \`$EXPECTED_MAIN\`"
            echo "- product base: \`$PRODUCT_BASE\`"
            echo "- workflow ref: \`${GITHUB_SHA}\`"
            echo
            echo 'Temporary GitHub-hosted preflight only. It does not push or alter the product branch.'
          } >> "$GITHUB_STEP_SUMMARY"
